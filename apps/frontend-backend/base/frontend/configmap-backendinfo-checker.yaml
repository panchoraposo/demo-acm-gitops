apiVersion: v1
kind: ConfigMap
metadata:
  name: backendinfo-checker
  namespace: frontend
data:
  checker.py: |
    import json
    import os
    import random
    import socket
    import subprocess
    import sys
    import time
    import urllib.error
    import urllib.request
    import urllib.parse
    from http.server import BaseHTTPRequestHandler, HTTPServer

    BACKEND_INFO_URL = os.environ.get("BACKEND_INFO_URL", "http://backend.backend.svc:9898/api/info")
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "9000"))
    TIMEOUT_SECONDS = float(os.environ.get("TIMEOUT_SECONDS", "2"))

    def _resolve_random_ip(hostname: str) -> str:
      # Resolve all A/AAAA records and pick one at random to
      # demonstrate backend scaling (different pod IPs).
      ips = []

      # Prefer getent: it returns all A records for headless services.
      try:
        out = subprocess.check_output(["getent", "hosts", hostname], timeout=1).decode("utf-8", "replace")
        for line in out.splitlines():
          parts = line.split()
          if parts:
            ips.append(parts[0])
      except Exception:
        pass

      if not ips:
        infos = socket.getaddrinfo(hostname, None)
        for family, _, _, _, sockaddr in infos:
          if family == socket.AF_INET:
            ips.append(sockaddr[0])
          elif family == socket.AF_INET6:
            ips.append(sockaddr[0])

      # Deduplicate but keep order stable.
      seen = set()
      ips = [ip for ip in ips if not (ip in seen or seen.add(ip))]
      if not ips:
        return hostname
      return random.choice(ips)

    def fetch_backend_info():
      parsed = urllib.parse.urlparse(BACKEND_INFO_URL)
      chosen_ip = _resolve_random_ip(parsed.hostname) if parsed.hostname else None
      url = BACKEND_INFO_URL
      host_header = parsed.hostname or ""
      if chosen_ip and parsed.hostname:
        # Replace hostname with chosen IP but preserve scheme/port/path/query.
        netloc = chosen_ip
        if parsed.port:
          netloc = f"{chosen_ip}:{parsed.port}"
        url = urllib.parse.urlunparse(
          (parsed.scheme, netloc, parsed.path, parsed.params, parsed.query, parsed.fragment)
        )

      req = urllib.request.Request(
        url,
        method="GET",
        headers={
          "Accept": "application/json",
          "Connection": "close",
          "Host": host_header,
        },
      )
      with urllib.request.urlopen(req, timeout=TIMEOUT_SECONDS) as resp:
        body = resp.read()
        return json.loads(body.decode("utf-8"))

    class Handler(BaseHTTPRequestHandler):
      def _send_json(self, status: int, payload):
        data = json.dumps(payload).encode("utf-8")
        self.send_response(status)
        self.send_header("Content-Type", "application/json; charset=utf-8")
        self.send_header("Content-Length", str(len(data)))
        self.end_headers()
        self.wfile.write(data)

      def do_GET(self):
        path = urllib.parse.urlparse(self.path).path

        if path == "/healthz":
          self.send_response(200)
          self.send_header("Content-Type", "text/plain")
          self.end_headers()
          self.wfile.write(b"ok")
          return

        if path != "/api/backendinfo":
          self._send_json(404, {"error": "not found"})
          return

        try:
          info = fetch_backend_info()
          self._send_json(200, info)
        except (urllib.error.URLError, socket.timeout) as e:
          self._send_json(
            503,
            {
              "error": "backend unreachable",
              "detail": str(e),
              "backendInfoUrl": BACKEND_INFO_URL,
              "timestamp": int(time.time()),
            },
          )
        except Exception as e:
          self._send_json(500, {"error": "unexpected error", "detail": str(e)})

      def log_message(self, fmt, *args):
        sys.stderr.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), fmt % args))

    if __name__ == "__main__":
      server = HTTPServer(("0.0.0.0", LISTEN_PORT), Handler)
      server.serve_forever()
