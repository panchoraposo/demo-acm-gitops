apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-site
  namespace: frontend
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>ACM + GitOps Governance Demo</title>
      <style>
        :root {
          color-scheme: dark;
          --bg: #0b1020;
          --card: #101827;
          --fg: #e5e7eb;
          --muted: #9ca3af;
          --ok: #2f9e44;
          --bad: #e03131;
          --warn: #f59f00;
          --border: #22304a;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
          background:
            radial-gradient(1200px 600px at 20% 10%, rgba(27,42,106,.25), transparent 60%),
            radial-gradient(1200px 600px at 90% 20%, rgba(166,30,77,.18), transparent 60%),
            var(--bg);
          color: var(--fg);
        }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 44px 18px; }
        .top { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; }
        h1 { font-size: 30px; margin: 0; letter-spacing: .2px; }
        .sub { color: var(--muted); margin-top: 8px; line-height: 1.5; max-width: 760px; }
        .pill {
          display:inline-flex; align-items:center; gap:10px;
          padding: 10px 14px; border-radius: 999px;
          background: rgba(17,24,39,.75);
          border: 1px solid #334155;
          font-weight: 700;
          user-select: none;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
        .grid { display:grid; grid-template-columns: 1fr; gap: 14px; margin-top: 18px; }
        @media (min-width: 980px) { .grid { grid-template-columns: 1.2fr .8fr; } }
        .card {
          background: linear-gradient(180deg, rgba(17,24,39,.78), rgba(11,18,36,.82));
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }
        .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .14em; }
        .v { font-size: 14px; margin-top: 6px; word-break: break-word; }
        pre {
          margin: 12px 0 0; padding: 14px; border-radius: 12px;
          background: #060a14; border: 1px solid #1f2a40;
          overflow:auto; line-height: 1.4;
          max-height: 320px;
        }
        .row { display:flex; gap:10px; flex-wrap:wrap; margin-top: 12px; }
        .btn {
          display:inline-flex; align-items:center; gap:10px;
          padding: 10px 14px; border-radius: 12px;
          border: 1px solid #334155; background: #0b1224;
          color: var(--fg); text-decoration:none; font-weight: 700;
        }
        .badge {
          display:inline-flex; align-items:center;
          padding: 2px 10px; border-radius: 999px;
          border: 1px solid #334155;
          font-weight: 800;
        }
        .two { display:grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
        @media (min-width: 980px) { .two { grid-template-columns: 1fr 1fr; } }
      </style>
    </head>
    <body>
      <div class="wrap">
        <div class="top">
          <div>
            <h1>ACM + GitOps Governance Demo</h1>
            <div class="sub">
              This frontend is served by <b>Red Hat UBI nginx</b>. It calls a local <b>/api/check</b> endpoint (sidecar)
              which attempts to reach <b>backend.backend.svc:8080</b>. NetworkPolicies make the result different between clusters.
            </div>
          </div>
          <div class="pill" title="Backend connectivity">
            <span class="dot" id="dot"></span>
            <span id="pillText">checking…</span>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="k">Cluster</div>
            <div class="v"><span class="badge" id="cluster">unknown</span></div>

            <div class="two">
              <div>
                <div class="k" style="margin-top:14px;">Backend URL</div>
                <div class="v" id="backendUrl">-</div>
              </div>
              <div>
                <div class="k" style="margin-top:14px;">Timestamp</div>
                <div class="v" id="ts">-</div>
              </div>
            </div>

            <div class="k" style="margin-top:14px;">Backend response / error</div>
            <pre id="detail">waiting…</pre>

            <div class="row">
              <a class="btn" href="/" onclick="setTimeout(run, 50)">Refresh</a>
              <a class="btn" href="/api/check" target="_blank" rel="noreferrer">Open /api/check</a>
            </div>
          </div>

          <div class="card">
            <div class="k">Expected behavior</div>
            <div class="v" style="margin-top:10px; line-height:1.6">
              <div><b>east</b>: frontend → backend <span style="color:var(--ok);font-weight:800">ALLOWED</span></div>
              <div><b>west</b>: frontend → backend <span style="color:var(--bad);font-weight:800">BLOCKED</span></div>
            </div>
            <div class="k" style="margin-top:14px;">Why this matters</div>
            <div class="v" style="line-height:1.6">
              GitOps continuously applies desired state, while ACM Governance enforces and reports compliance across clusters.
              This page makes NetworkPolicy differences visible in a browser.
            </div>
          </div>
        </div>
      </div>

      <script>
        const dot = document.getElementById('dot');
        const pillText = document.getElementById('pillText');
        const cluster = document.getElementById('cluster');
        const backendUrl = document.getElementById('backendUrl');
        const ts = document.getElementById('ts');
        const detail = document.getElementById('detail');

        function setStatus(ok, text) {
          dot.style.background = ok === true ? 'var(--ok)' : ok === false ? 'var(--bad)' : 'var(--warn)';
          pillText.textContent = text;
        }

        async function run() {
          setStatus(null, 'checking…');
          try {
            const res = await fetch('/api/check', { cache: 'no-store' });
            const data = await res.json();

            cluster.textContent = data.cluster || 'unknown';
            backendUrl.textContent = data.backendUrl || '-';
            ts.textContent = data.timestamp || '-';
            detail.textContent = (data.detail || '').trim() || '(empty)';

            if (data.ok) setStatus(true, 'backend reachable');
            else setStatus(false, 'backend blocked');
          } catch (e) {
            setStatus(false, 'check failed');
            detail.textContent = String(e);
          }
        }

        run();
        setInterval(run, 3000);
      </script>
    </body>
    </html>
