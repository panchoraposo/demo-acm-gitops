apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: demo-fb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: demo-fb
    spec:
      volumes:
        - name: ui
          configMap:
            name: frontend-ui
        - name: assets
          secret:
            secretName: frontend-assets
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
        - name: backendinfo-checker
          configMap:
            name: backendinfo-checker
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-124:1
          imagePullPolicy: IfNotPresent
          command: ["/usr/libexec/s2i/run"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: ui
              mountPath: /opt/app-root/ui
            - name: assets
              mountPath: /opt/app-root/src/cuddle.gif
              subPath: cuddle.gif
            - name: nginx-conf
              mountPath: /opt/app-root/etc/nginx.default.d/demo.conf
              subPath: demo.conf
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            timeoutSeconds: 2

        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.14.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PODINFO_UI_MESSAGE
              value: "unknown"
            - name: PODINFO_UI_COLOR
              value: "#34577c"
            - name: PODINFO_UI_LOGO
              value: "/cuddle.gif"
            - name: PODINFO_BACKEND_URL
              value: "http://backend.backend.svc:9898/echo"
          ports:
            - name: podinfo
              containerPort: 9898
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: podinfo
            initialDelaySeconds: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: podinfo
            initialDelaySeconds: 2
            timeoutSeconds: 2

        - name: backendinfo
          image: registry.access.redhat.com/ubi9/python-312:1
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_INFO_URL
              value: "http://backend-headless.backend.svc:9898/api/info"
            - name: LISTEN_PORT
              value: "9000"
          ports:
            - name: backendinfo
              containerPort: 9000
          command: ["python3"]
          args: ["/opt/app-root/src/checker.py"]
          volumeMounts:
            - name: backendinfo-checker
              mountPath: /opt/app-root/src/checker.py
              subPath: checker.py
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: backendinfo
            initialDelaySeconds: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: backendinfo
            initialDelaySeconds: 2
            timeoutSeconds: 2
