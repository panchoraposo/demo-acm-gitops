apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: demo-fb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: demo-fb
    spec:
      containers:
        - name: frontend
          image: registry.access.redhat.com/ubi9/python-312:1
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(3600)"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
