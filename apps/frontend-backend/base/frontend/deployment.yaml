apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: demo-fb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: demo-fb
    spec:
      containers:
        - name: frontend
          image: ghcr.io/stefanprodan/podinfo:6.14.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PODINFO_UI_MESSAGE
              value: "unknown"
            - name: PODINFO_UI_COLOR
              value: "#34577c"
            - name: PODINFO_BACKEND_URL
              value: "http://backend.backend.svc:9898/"
          ports:
            - name: http
              containerPort: 9898
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            timeoutSeconds: 2
