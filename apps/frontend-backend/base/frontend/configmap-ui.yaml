apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-ui
  namespace: frontend
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>podinfo demo</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <link rel="shortcut icon" type="image/png" href="https://kubernetes.io/images/favicon.png">
      <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Material+Icons" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet">
      <style>
        [v-cloak] { display: none; }
        html, body { height: 100%; margin: 0; }
      </style>
    </head>
    <body>
    <div id="app" v-cloak>
      <v-app dark>
        <v-content>
          <section :style="cuddleStyle">
              <v-layout column align-center justify-center class="white--text" style="min-height: 100vh;">
                <img :src="info.logo" height="350">
                <h1 class="white--text mb-2 display-1 text-xs-center">${ info.message }</h1>
                <div class="subheading mb-2 text-xs-center">Served by <b>${ info.hostname }</b></div>

                <v-btn class="red darken-2 mt-5" dark large @click="postBackend()">
                  <v-badge left color="red">
                    <span slot="badge">${ pings }</span>
                    <v-icon left dark>touch_app</v-icon>
                  </v-badge>
                  Ping
                </v-btn>

                <v-card outlined color="transparent" class="mt-3" style="min-width: 360px; max-width: 560px;">
                  <v-card-text class="white--text">
                    <div class="subtitle-1 mb-1"><b>Last backend pod</b></div>
                    <div v-if="lastPing.ok === true">
                      <div><b>${ lastPing.hostname }</b></div>
                      <div class="caption">version ${ lastPing.version } · revision ${ lastPing.revision }</div>
                    </div>
                    <div v-else-if="lastPing.ok === false">
                      <div><b>blocked/unreachable</b></div>
                      <div class="caption">${ lastPing.error }</div>
                    </div>
                    <div v-else class="caption">
                      Click <b>Ping</b> to test frontend → backend connectivity.
                    </div>
                  </v-card-text>
                </v-card>
              </v-layout>
          </section>

          <v-footer class="blue darken-2">
            <v-layout row wrap align-center>
              <v-flex xs12>
                <div class="white--text ml-3">
                  Powered by <a class="white--text" href="https://github.com/stefanprodan/podinfo" target="_blank">podinfo</a>
                  version ${ info.version } revision ${ info.revision }
                  Swagger <a class="white--text" href="/swagger/">docs</a>
                </div>
              </v-flex>
            </v-layout>
          </v-footer>
        </v-content>
      </v-app>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script>
      new Vue({
        delimiters: ['${', '}'],
        el: '#app',
        vuetify: new Vuetify(),
        data: function() {
          return {
            info: {},
            timer: '',
            echoText: '',
            pings: 0,
            lastPing: { ok: null, hostname: '', version: '', revision: '', error: '' },
            cuddleStyle: { backgroundColor: '#34577c', minHeight: '100vh' },
          }
        },
        created: function() {
          this.getInfo();
          this.timer = setInterval(this.getInfo, 3000);
        },
        methods: {
          getInfo: function() {
            const xhr = new XMLHttpRequest();
            let self = this;
            xhr.open('GET', "/api/info");
            xhr.onload = function () {
              const data = JSON.parse(xhr.responseText);
              self.info = data;
              self.cuddleStyle = { backgroundColor: (data.color || '#34577c'), minHeight: '100vh' };
              document.title = data.hostname || 'podinfo';
            };
            xhr.onerror = function() {
              console.log(xhr.responseText || 'Network request failed');
            };
            xhr.send();
          },
          postBackend: function() {
            var self = this;
            self.echoText = '';
            fetch("/api/echo", {
              method: 'post',
              headers: {
                "Content-type": "application/json; charset=UTF-8",
                "X-APP": Math.random(),
              },
              body: JSON.stringify({random: Math.random()})
            })
            .then(function(response) {
              self.pings++;
              return response.json();
            })
            .then(function(json) {
              self.echoText = Array.isArray(json) ? json.join(' | ') : JSON.stringify(json);
              return fetch("/api/backendinfo", { method: "GET" });
            })
            .then(function(resp) {
              if (!resp) return;
              if (!resp.ok) {
                self.lastPing = { ok: false, hostname: '', version: '', revision: '', error: 'HTTP ' + resp.status + ' from /api/backendinfo' };
                return;
              }
              return resp.json().then(function(info) {
                self.lastPing = {
                  ok: true,
                  hostname: info.hostname || '',
                  version: info.version || '',
                  revision: info.revision || '',
                  error: ''
                };
              });
            })
            .catch(function (error) {
              self.lastPing = { ok: false, hostname: '', version: '', revision: '', error: '' + error };
            });
          }
        }
      })
    </script>
    </body>
    </html>
