apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-ui
  namespace: frontend
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>podinfo demo</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <link rel="shortcut icon" type="image/png" href="https://kubernetes.io/images/favicon.png">
      <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Material+Icons" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet">
      <style>
        [v-cloak] { display: none; }
        html, body { height: 100%; margin: 0; }
      </style>
    </head>
    <body>
    <div id="app" v-cloak>
      <v-app dark>
        <v-content>
          <v-container fluid fill-height :style="cuddleStyle" class="white--text">
            <v-row align="center" justify="center" class="text-center">
              <v-col cols="12" sm="10" md="6" lg="5">
                <img src="/cuddle.gif" height="320" style="max-width: 100%; height: auto;">
                <h1 class="white--text mb-2 display-1">${ info.message }</h1>
                <div class="subheading mb-4">Served by <b>${ info.hostname }</b></div>

                <v-btn class="red darken-2" dark large :loading="loading" @click="postBackend()">
                  <v-badge left color="red">
                    <span slot="badge">${ pings }</span>
                    <v-icon left dark>touch_app</v-icon>
                  </v-badge>
                  Ping
                </v-btn>

                <div class="mt-4">
                  <div class="d-flex align-center justify-center">
                    <v-icon :color="lastPing.ok === true ? 'green' : (lastPing.ok === false ? 'red' : 'grey')">lens</v-icon>
                    <v-icon class="ml-2" :color="lastPing.ok === true ? 'green' : (lastPing.ok === false ? 'red' : 'grey')">lens</v-icon>

                    <div class="ml-3 subtitle-1" v-if="lastPing.ok === true">
                      <b>${ lastPing.hostname }</b>
                    </div>
                    <div class="ml-3 subtitle-1" v-else-if="lastPing.ok === false">
                      <b>blocked/unreachable</b>
                    </div>
                  </div>

                  <div v-if="lastPing.ok === false" class="caption white--text mt-2">
                    ${ lastPing.error }
                  </div>
                </div>
              </v-col>
            </v-row>
          </v-container>
        </v-content>
      </v-app>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script>
      new Vue({
        delimiters: ['${', '}'],
        el: '#app',
        vuetify: new Vuetify(),
        data: function() {
          return {
            info: {},
            timer: '',
            pings: 0,
            loading: false,
            lastPing: { ok: null, hostname: '', version: '', revision: '', error: '' },
            cuddleStyle: { backgroundColor: '#34577c', minHeight: '100vh' },
          }
        },
        created: function() {
          this.getInfo();
          this.getBackendInfo();
          this.timer = setInterval(this.getInfo, 3000);
        },
        methods: {
          getInfo: function() {
            const xhr = new XMLHttpRequest();
            let self = this;
            xhr.open('GET', "/api/info");
            xhr.onload = function () {
              const data = JSON.parse(xhr.responseText);
              self.info = data;
              self.cuddleStyle = { backgroundColor: (data.color || '#34577c'), minHeight: '100vh' };
              document.title = data.hostname || 'podinfo';
            };
            xhr.onerror = function() {
              console.log(xhr.responseText || 'Network request failed');
            };
            xhr.send();
          },
          getBackendInfo: function() {
            var self = this;
            self.loading = true;
            var ctrl = new AbortController();
            var timeout = setTimeout(function() { ctrl.abort(); }, 4000);
            var url = "/api/backendinfo?ts=" + Date.now() + "&r=" + Math.random();
            return fetch(url, { method: "GET", signal: ctrl.signal })
              .then(function(resp) {
                clearTimeout(timeout);
                if (!resp) return;
                if (!resp.ok) {
                  self.lastPing = { ok: false, hostname: '', version: '', revision: '', error: 'HTTP ' + resp.status + ' from /api/backendinfo' };
                  return;
                }
                return resp.json().then(function(info) {
                  self.lastPing = {
                    ok: true,
                    hostname: info.hostname || '',
                    version: info.version || '',
                    revision: info.revision || '',
                    error: ''
                  };
                });
              })
              .catch(function(error) {
                clearTimeout(timeout);
                self.lastPing = { ok: false, hostname: '', version: '', revision: '', error: '' + error };
              })
              .finally(function() {
                self.loading = false;
              });
          },
          postBackend: function() {
            var self = this;
            self.pings++;
            return self.getBackendInfo();
          }
        }
      })
    </script>
    </body>
    </html>
