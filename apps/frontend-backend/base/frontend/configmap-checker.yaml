apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-checker
  namespace: frontend
data:
  checker.py: |
    import json
    import os
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer


    CLUSTER = os.environ.get("CLUSTER_NAME", "unknown")
    BACKEND_URL = os.environ.get("BACKEND_URL", "http://backend.backend.svc:8080/")


    def now():
        return time.strftime("%Y-%m-%d %H:%M:%S %Z", time.localtime())


    def check_backend():
        try:
            with urllib.request.urlopen(BACKEND_URL, timeout=2) as r:
                body = r.read(200).decode("utf-8", errors="ignore")
            return True, body.strip() or "(empty response)"
        except Exception as e:
            return False, str(e)


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            p = self.path.split("?", 1)[0].rstrip("/")
            if p not in ("/api/check", "/check"):
                self.send_response(404)
                self.end_headers()
                return

            ok, detail = check_backend()
            payload = {
                "cluster": CLUSTER,
                "backendUrl": BACKEND_URL,
                "ok": ok,
                "detail": detail,
                "timestamp": now(),
            }

            body = json.dumps(payload, indent=2).encode("utf-8")
            self.send_response(200 if ok else 503)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            return


    HTTPServer(("0.0.0.0", 9000), Handler).serve_forever()

