apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/service-headless.yaml
  - frontend/configmap-ui.yaml
  - frontend/configmap-nginx.yaml
  - frontend/configmap-backendinfo-checker.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/route.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: frontend-assets
    namespace: frontend
    files:
      - frontend/assets/cuddle.gif

